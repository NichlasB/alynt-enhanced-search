name: Build Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create plugin zip
        run: |
          mkdir -p dist/package/alynt-enhanced-search
          rsync -av ./ dist/package/alynt-enhanced-search/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='tests' \
            --exclude='coverage' \
            --exclude='scripts' \
            --exclude='composer.phar' \
            --exclude='*.map'
          cd dist/package && zip -r ../alynt-enhanced-search.zip alynt-enhanced-search

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/alynt-enhanced-search.zip
